<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Robô Apollo | Finalizar Compra</title>

<!-- CSS integrado -->
<style>
    :root {
        --yellow: #ffd600;
        --dark:  #1d1d1d;
        --light: #ffffff;
        --gray:  #f6f6f6;
    }

    /* Reset leve */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        color: var(--dark);
        background: var(--gray);
        line-height: 1.5;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    /* ---------- HEADER ---------- */
    header {
        background: var(--light);
        border-bottom: 2px solid var(--yellow);
        padding: 16px 8%;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    #nav_logo {
        height: 60px;
        width: auto;
    }

    nav ul {
        list-style: none;
        display: flex;
        gap: 40px;
        font-weight: 600;
    }

    nav a {
        text-decoration: none;
        color: var(--dark);
        padding: 8px 12px;
        transition: background 0.3s, color 0.3s;
        border-radius: 4px;
    }

    nav a:hover {
        background: var(--yellow);
    }

    /* ---------- MAIN ---------- */
    main {
        flex: 1;
        max-width: 1000px;
        width: 90%;
        margin: 48px auto;
        background: var(--light);
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        padding: 32px;
    }

    h1 {
        font-size: 1.8rem;
        margin-bottom: 24px;
        border-left: 8px solid var(--yellow);
        padding-left: 12px;
    }

    /* ---------- PRODUTO ---------- */
    .product-summary {
        display: flex;
        gap: 32px;
        align-items: center;
        border: 2px solid var(--yellow);
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 32px;
        background: var(--gray);
    }

    .product-summary img {
        max-width: 220px;
        width: 100%;
        border-radius: 8px;
    }

    .product-info h2 { font-size: 1.4rem; margin-bottom: 12px; }
    .product-info p  { margin-bottom: 8px; }
    .price {
        font-size: 1.6rem;
        font-weight: bold;
        color: var(--dark);
    }

    /* ---------- FORMULÁRIO ---------- */
    form {
        display: grid;
        gap: 20px;
    }

    form label {
        display: flex;
        flex-direction: column;
        font-weight: 600;
        font-size: 0.9rem;
    }

    form input, form textarea, form select {
        padding: 10px 12px;
        border: 2px solid var(--dark);
        border-radius: 6px;
        font-size: 1rem;
    }

    form textarea { resize: vertical; min-height: 80px; }

    .btn-primary {
        background: var(--dark);
        color: var(--light);
        border: none;
        padding: 14px 26px;
        font-size: 1rem;
        font-weight: 700;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.3s, color 0.3s;
        width: fit-content;
    }
    .btn-primary:hover {
        background: var(--yellow);
        color: var(--dark);
    }

    /* ---------- FOOTER ---------- */
    footer {
        text-align: center;
        padding: 24px 0;
        background: var(--light);
        border-top: 2px solid var(--yellow);
        font-size: 0.85rem;
    }

    @media (max-width: 720px) {
        .product-summary { flex-direction: column; text-align: center; }
        nav ul        { gap: 20px; }
    }
</style>
</head>

<body>
    <!-- ========== HEADER / NAV ========== -->
    <header>
        <img src="scr/image/logo_robo.png" id="nav_logo" alt="Logo Robô Apollo" />
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="index.html#produtos">Produtos</a></li>
            </ul>
        </nav>
    </header>

    <!-- ========== MAIN CONTENT ========== -->
    <main>
        <h1>Revisar e Finalizar Compra</h1>

        <!-- Produto Selecionado -->
        <section class="product-summary">
            <img id="product-img" src="scr/image/robo 1.jpg" alt="Produto escolhido">
            <div class="product-info">
                <h2 id="product-name"></h2>
                <div id="product-desc"></div>
                <p id="product-price" class="price"></p>
            </div>
        </section>


        <!-- Formulário / Fechamento -->
        <form>
            <label>
                Nome completo
                <input type="text" placeholder="Digite seu nome" required>
            </label>

            <label>
                E‑mail
                <input type="email" placeholder="exemplo@email.com" required>
            </label>

            <label>
                Endereço completo
                <textarea placeholder="Rua, número, bairro, cidade, CEP" required></textarea>
            </label>

            <label>
                Forma de pagamento
                <select required>
                    <option value="" disabled selected>Escolha</option>
                    <option>Cartão de crédito</option>
                    <option>Pix</option>
                    <option>Boleto bancário</option>
                </select>
            </label>

            <button type="submit" class="btn-primary">Finalizar Compra</button>
        </form>
    </main>

    <!-- ========== FOOTER ========== -->
    <footer>
        &copy; 2025 Robô Apollo — Todos os direitos reservados.
    </footer>
    <script>
    // 1. lê o parâmetro ?produto=…
    const params  = new URLSearchParams(window.location.search);
    const escolha = params.get('produto');   // "junior" ou "pro"

    // 2. dados dos dois modelos
    const produtos = {
        junior: {
            nome: "Robô Apollo — Versão Junior",
            descricao: [
                "• Comprimento 100 cm × 40 cm",
                "• Interação básica e controle manual"
            ],
            preco: "R$ 1.999,90",
            imagem: "scr/image/robo 1.jpg"
        },
        pro: {
            nome: "Robô Apollo — Versão Pro",
            descricao: [
                "• Comprimento - 150Cm x 60Cm ",
                "• Sensores para interação com crianças autistas",
                "• Bateria de 12 h + app de monitoramento"
            ],
            preco: "R$ 2.999,90",
            imagem: "scr/image/robo 1.jpg"
        }
    };

    // 3. escolhe o objeto certo ou cai no Pro como padrão
    const p = produtos[escolha] || produtos.pro;

    // 4. preenche na página
    document.getElementById("product-name").textContent = p.nome;
    document.getElementById("product-price").textContent = p.preco;
    document.getElementById("product-img").src = p.imagem;

    // monta a lista de <p> para a descrição
    document.getElementById("product-desc").innerHTML =
        p.descricao.map(txt => `<p>${txt}</p>`).join("");
</script>

</body>
</html>
